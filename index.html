<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafe POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3ece1;--card:#fffaf2;--ink:#2b1d14;--mute:#7a6757;--line:#e0d3c1;--acc:#6f4a2f;--accInk:#fff;--ok:#1f7a45;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1511;--card:#2a211b;--ink:#f3e9dc;--mute:#b3a08d;--line:#443629;--acc:#d9a66b;--accInk:#1c1511;--ok:#5fcf93;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",Verdana,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:transparent;border:2px solid var(--acc);border-radius:8px;padding:8px 12px;font-weight:700}
.btn.fill{background:var(--acc);color:var(--accInk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.st{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--bad);flex:none}.st.ok .dot{background:var(--ok)}
.app{display:grid;grid-template-columns:1fr 350px;gap:16px;padding:16px;max-width:1200px;margin:auto}
#mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
@media(min-width:821px){.cats{flex-wrap:wrap;overflow:visible}}
@media(max-width:820px){
.app{grid-template-columns:1fr;padding:12px 12px 90px}
.panel{position:static}
#mbar.on{display:block}
}
@media(max-width:520px){
header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
h1{font-size:18px}
.st{order:3;width:100%}
header .bar{width:100%}
header .bar .btn{flex:1;padding:10px 6px;font-size:14px}
.cat{min-width:84px;padding:10px 8px}
.cat .ic{font-size:26px}
.items{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q button{width:38px;height:38px}
dialog{width:calc(100% - 24px)}
}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.cat{flex:none;min-width:96px;padding:12px 10px;background:var(--card);border:2px solid var(--line);border-radius:12px;text-align:center;font-weight:700;font-size:14px}
.cat .ic{display:block;font-size:30px;line-height:1.2}
.cat[aria-pressed=true]{border-color:var(--acc);background:var(--acc);color:var(--accInk)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.item h3{margin:0 0 8px;font-size:16px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sz{flex:1 1 auto;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-weight:700}
.sz:hover,.sz:active{border-color:var(--acc)}
.sz small{display:block;color:var(--mute);font-weight:400}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start;position:sticky;top:12px}
.panel h2{margin:0 0 8px;font-size:18px}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .nm{flex:1;font-size:14px}.line .nm small{color:var(--mute);display:block}
.q{display:flex;align-items:center;gap:6px}
.q button{width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);background:transparent;font-weight:700;font-size:18px;line-height:1}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin:12px 0}
.empty{color:var(--mute);padding:24px 8px;text-align:center}
#msg{min-height:20px;font-size:14px;margin:8px 0 0}#msg.err{color:var(--bad)}#msg.good{color:var(--ok)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:380px}
dialog label{display:block;margin:10px 0 4px;font-size:14px;font-weight:700}
dialog input,dialog select{width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
#slip{display:none}
@media print{
@page{size:80mm auto;margin:0}
body{background:#fff}header,.app,dialog,#mbar{display:none!important}
#slip{display:block;width:72mm;margin:0 auto;padding:4mm 0;color:#000;background:#fff;font:13px/1.35 "Courier New",monospace}
#slip.w58{width:48mm}#slip .c{text-align:center}#slip .b{font-weight:700;font-size:16px}
#slip .r{display:flex;justify-content:space-between;gap:8px}#slip hr{border:0;border-top:1px dashed #000;margin:5px 0}}
</style>
</head>
<body>
<header>
  <h1>☕ Cafe POS</h1>
  <div class="st" id="st"><span class="dot"></span><span id="stT">Checking printer…</span></div>
  <div class="bar">
    <button class="btn" id="conn">Connect printer</button>
    <button class="btn" id="imp">Import menu</button>
    <button class="btn" id="set">Settings</button>
    <input type="file" id="file" accept=".csv,.xlsx,.xls" hidden>
  </div>
</header>

<div class="app">
  <section aria-label="Menu">
    <div class="cats" id="cats" role="group" aria-label="Categories"></div>
    <div class="items" id="items"></div>
  </section>
  <aside class="panel" aria-label="Current order">
    <h2>Order <span id="ordNo" style="color:var(--mute);font-weight:400"></span></h2>
    <div id="cart"></div>
    <div class="tot"><span>Total</span><span id="total">0</span></div>
    <div class="bar"><button class="btn fill" id="print" style="flex:1">Print slip</button><button class="btn" id="clear">Clear</button></div>
    <p id="msg" role="status" aria-live="polite"></p>
  </aside>
</div>

<div id="mbar"><button class="btn fill" id="mgo" style="width:100%;padding:12px"></button></div>

<dialog id="dlg">
  <form method="dialog">
    <h2 style="margin-top:0">Settings</h2>
    <label for="shop">Shop name (printed on slip)</label><input id="shop">
    <label for="cur">Currency label (optional)</label><input id="cur" placeholder="e.g. Rs">
    <label for="width">Paper width</label><select id="width"><option value="80">80 mm</option><option value="58">58 mm</option></select>
    <p><button type="button" class="btn" id="sample">Download sample CSV</button></p>
    <p><button type="button" class="btn" id="wipe">Delete saved menu</button></p>
    <button class="btn fill">Done</button>
  </form>
</dialog>

<div id="slip" aria-hidden="true"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const S = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ICONS=[[/frap|iced|cold|smoothie|shake|juice|soda|water/,'🥤'],[/coffee|espresso|latte|cappuc|americano|mocha/,'☕'],[/pancake|waffle|crepe/,'🥞'],[/tea|chai/,'🍵'],[/cake|dessert|brownie|cookie|sweet/,'🍰'],[/sandwich|burger|wrap|sub/,'🥪'],[/pizza/,'🍕'],[/pasta|noodle/,'🍝'],[/fries|snack|side|nugget/,'🍟'],[/croissant|bakery|bread|pastry|donut/,'🥐'],[/salad/,'🥗'],[/egg|breakfast|omelet/,'🍳'],[/ice cream|gelato/,'🍨'],[/soup/,'🍲']];
const iconFor = n => { n=n.toLowerCase(); for(const [re,ic] of ICONS) if(re.test(n)) return ic; return '🍽️'; };
const fmt = n => { const cur=S.get('cur',''); return (cur?cur+' ':'')+(+n.toFixed(2)); };

let menu = JSON.parse(S.get('menu','[]')), curCat = null, cart = new Map();
let order = +S.get('order','1');

// ---------- Menu import ----------
function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','||c==';'||c=='\t'){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n')i++; r.push(f);f='';rows.push(r);r=[] }
    else f+=c }
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
function normalise(rows){
  rows = rows.filter(r=>r.some(c=>String(c??'').trim()!==''));
  if(!rows.length) return [];
  const head = rows[0].map(c=>String(c??'').trim().toLowerCase());
  const find = re => head.findIndex(h=>re.test(h));
  let ix = {cat:find(/categ/),item:find(/item|name|product/),size:find(/size/),price:find(/price|rate|cost|amount/)};
  let body = rows.slice(1);
  if(Object.values(ix).some(v=>v<0)){ ix={cat:0,item:1,size:2,price:3}; body=rows; }
  return body.map(r=>({
    category:String(r[ix.cat]??'').trim(), item:String(r[ix.item]??'').trim(),
    size:String(r[ix.size]??'').trim(), price:parseFloat(String(r[ix.price]??'').replace(/[^0-9.]/g,''))
  })).filter(x=>x.category&&x.item&&isFinite(x.price));
}
async function importFile(file){
  try{
    let rows;
    if(/\.xlsx?$/i.test(file.name)){
      if(typeof XLSX==='undefined') throw new Error('Excel reader did not load (no internet?). Save the sheet as CSV and try again.');
      const wb=XLSX.read(await file.arrayBuffer());
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    } else rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));
    const m=normalise(rows);
    if(!m.length) throw new Error('No valid rows found. Columns needed: category, item, size, price.');
    menu=m; S.set('menu',JSON.stringify(menu)); curCat=null; cart.clear();
    render(); msg(`Menu loaded: ${m.length} entries.`,'good');
  }catch(e){ msg(e.message,'err'); }
}
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{ if(e.target.files[0]) importFile(e.target.files[0]); e.target.value=''; };

// ---------- Rendering ----------
function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const k in attrs){ if(k.startsWith('on')) el[k]=attrs[k]; else el.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>el.append(c));
  return el;
}
function categories(){ return [...new Set(menu.map(m=>m.category))]; }
function renderMenu(){
  const cats=categories(), ci=$('cats'), it=$('items');
  ci.replaceChildren(); it.replaceChildren();
  if(!cats.length){
    it.append(h('div',{class:'empty'},'No menu yet. Press “Import menu” and choose your CSV or Excel file (columns: category, item, size, price).'));
    return;
  }
  if(!cats.includes(curCat)) curCat=cats[0];
  cats.forEach(c=>ci.append(h('button',{class:'cat','aria-pressed':String(c===curCat),onclick:()=>{curCat=c;renderMenu()}},
    h('span',{class:'ic','aria-hidden':'true'},iconFor(c)),c)));
  const groups=new Map();
  menu.filter(m=>m.category===curCat).forEach(m=>{ if(!groups.has(m.item)) groups.set(m.item,[]); groups.get(m.item).push(m); });
  groups.forEach((list,name)=>{
    const sizes=h('div',{class:'sizes'});
    list.forEach(m=>sizes.append(h('button',{class:'sz','aria-label':`Add ${name} ${m.size}`,onclick:()=>add(m)},
      m.size?h('small',{},m.size):'', fmt(m.price))));
    it.append(h('div',{class:'item'},h('h3',{},name),sizes));
  });
}
const key = m => [m.category,m.item,m.size].join('|');
function add(m){ const k=key(m); const l=cart.get(k)||{...m,qty:0}; l.qty++; cart.set(k,l); renderCart(); }
function renderCart(){
  const box=$('cart'); box.replaceChildren();
  let total=0;
  if(!cart.size) box.append(h('div',{class:'empty'},'Tap items to add them.'));
  cart.forEach((l,k)=>{
    total+=l.price*l.qty;
    box.append(h('div',{class:'line'},
      h('div',{class:'nm'},l.item,h('small',{},(l.size?l.size+' · ':'')+fmt(l.price))),
      h('div',{class:'q'},
        h('button',{'aria-label':'Remove one '+l.item,onclick:()=>{ if(--l.qty<=0) cart.delete(k); renderCart(); }},'−'),
        h('strong',{},String(l.qty)),
        h('button',{'aria-label':'Add one '+l.item,onclick:()=>{l.qty++;renderCart()}},'+')),
      h('strong',{style:'min-width:56px;text-align:right'},fmt(l.price*l.qty))));
  });
  $('total').textContent=fmt(total);
  $('print').disabled=!cart.size; $('clear').disabled=!cart.size;
  $('ordNo').textContent='#'+order;
  const n=[...cart.values()].reduce((a,l)=>a+l.qty,0);
  $('mbar').classList.toggle('on',n>0);
  $('mgo').textContent=`View order · ${n} item${n===1?'':'s'} · ${fmt(total)}`;
}
$('mgo').onclick=()=>document.querySelector('.panel').scrollIntoView({behavior:'smooth'});
function render(){ renderMenu(); renderCart(); }
function msg(t,c){ const m=$('msg'); m.textContent=t; m.className=c||''; }
$('clear').onclick=()=>{cart.clear();renderCart();msg('')};

// ---------- Settings ----------
$('shop').value=S.get('shop',''); $('cur').value=S.get('cur',''); $('width').value=S.get('width','80');
$('shop').oninput=()=>S.set('shop',$('shop').value);
$('cur').oninput=()=>{S.set('cur',$('cur').value);render()};
$('width').onchange=()=>S.set('width',$('width').value);
$('set').onclick=()=>$('dlg').showModal();
$('wipe').onclick=()=>{ if(confirm('Delete the saved menu from this browser?')){ menu=[];cart.clear();S.set('menu','[]');render();$('dlg').close(); } };
$('sample').onclick=()=>{
  const csv='category,item,size,price\nHot Coffee,Espresso,Single,250\nHot Coffee,Espresso,Double,350\nHot Coffee,Latte,Small,400\nHot Coffee,Latte,Large,500\nFrappe,Caramel Frappe,Regular,650\nPancakes,Nutella Pancakes,Regular,700\n';
  const a=h('a',{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:'menu-sample.csv'}); a.click();
};

// ---------- USB printer ----------
let device=null, epOut=null;
const hasUSB='usb' in navigator;
function setSt(ok,t){ $('st').className='st'+(ok?' ok':''); $('stT').textContent=t; }
async function openDev(dev){
  await dev.open();
  if(dev.configuration===null) await dev.selectConfiguration(1);
  for(const itf of dev.configuration.interfaces) for(const alt of itf.alternates){
    const ep=alt.endpoints.find(e=>e.direction==='out'&&e.type==='bulk');
    if(ep&&(alt.interfaceClass===7||!epOut)){
      await dev.claimInterface(itf.interfaceNumber);
      device=dev; epOut=ep.endpointNumber; return;
    }
  }
  throw new Error('No printable endpoint found.');
}
async function tryOpen(dev){
  try{ await openDev(dev); setSt(true,'Printer ready: '+(dev.productName||'USB printer')); }
  catch(e){ device=null; setSt(false,'Printer found but Windows driver is using it. Normal print window will be used.'); }
}
async function refresh(){
  if(!hasUSB){ setSt(false,'Use Chrome/Edge for direct USB printing. Normal print window will be used.'); $('conn').disabled=true; return; }
  const p=await navigator.usb.getDevices();
  if(p.length) await tryOpen(p[0]); else setSt(false,'Printer not connected. Press “Connect printer” once.');
}
$('conn').onclick=async()=>{ try{ await tryOpen(await navigator.usb.requestDevice({filters:[]})); }catch(e){ if(e.name!=='NotFoundError') msg(e.message,'err'); } };
if(hasUSB){
  navigator.usb.addEventListener('connect',refresh);
  navigator.usb.addEventListener('disconnect',e=>{ if(device&&e.device===device){device=null;setSt(false,'Printer unplugged.');} else refresh(); });
}

// ---------- Slip ----------
const enc=s=>Uint8Array.from(Array.from(s).map(ch=>{const c=ch.charCodeAt(0);return c<128?c:63}));
const lines=()=>[...cart.values()];
function escpos(cols){
  const o=[],P=(...b)=>o.push(Uint8Array.from(b)),T=s=>o.push(enc(s));
  const row=(l,r)=>l.slice(0,Math.max(1,cols-r.length-1)).padEnd(cols-r.length)+r+'\n';
  const shop=S.get('shop',''), dash='-'.repeat(cols);
  let total=0;
  P(0x1B,0x40,0x1B,0x61,1);
  if(shop){P(0x1B,0x45,1,0x1D,0x21,0x11);T(shop+'\n');P(0x1D,0x21,0,0x1B,0x45,0)}
  T(new Date().toLocaleString()+'\nOrder #'+order+'\n');
  P(0x1B,0x61,0); T(dash+'\n');
  lines().forEach(l=>{ const lt=l.price*l.qty; total+=lt;
    T(row(`${l.qty}x ${l.item}${l.size?' ('+l.size+')':''}`,fmt(lt))); });
  T(dash+'\n'); P(0x1B,0x45,1,0x1D,0x21,0x01); T(row('TOTAL',fmt(total))); P(0x1D,0x21,0,0x1B,0x45,0);
  P(0x1B,0x61,1); T('\nThank you!\n\n\n\n'); P(0x1D,0x56,0x42,0x00);
  const b=new Uint8Array(o.reduce((a,x)=>a+x.length,0)); let p=0; o.forEach(x=>{b.set(x,p);p+=x.length}); return b;
}
function browserPrint(){
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const el=$('slip'); el.className=S.get('width','80')==='58'?'w58':'';
  let total=0, body='';
  lines().forEach(l=>{ const lt=l.price*l.qty; total+=lt;
    body+=`<div class="r"><span>${l.qty}x ${esc(l.item)}${l.size?' ('+esc(l.size)+')':''}</span><span>${fmt(lt)}</span></div>`; });
  const shop=S.get('shop','');
  el.innerHTML=(shop?`<div class="c b">${esc(shop)}</div>`:'')+`<div class="c">${esc(new Date().toLocaleString())}<br>Order #${order}</div><hr>${body}<hr><div class="r b"><span>TOTAL</span><span>${fmt(total)}</span></div><div class="c" style="margin-top:8px">Thank you!</div>`;
  window.print();
}
$('print').onclick=async()=>{
  if(!cart.size) return;
  let done=false;
  if(device){
    try{ await device.transferOut(epOut,escpos(S.get('width','80')==='58'?32:42)); done=true; }
    catch(e){ device=null; setSt(false,'Lost connection to printer.'); }
  }
  if(!done) browserPrint();
  order++; S.set('order',order); cart.clear(); renderCart(); msg('Slip sent.','good');
};

render(); refresh();
})();
</script>
</body>
</html>
